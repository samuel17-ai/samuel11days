const COLORS=["#087f8c", "#c46d29", "#5f6caf", "#28896b", "#ac5576", "#738a35", "#b44b3e", "#4873a6", "#8a5fa5", "#a56b12", "#44666c"];
const markerDays={'南昌':'D1','长沙':'D1/2','凤凰古城':'D2/3','矮寨大桥':'D3','芙蓉镇':'D3/4','武陵源':'D4–7','天门山索道下站':'D7','七十二奇楼':'D7','恩施市':'D7–9','恩施大峡谷':'D8','屏山峡谷':'D9','宣恩县':'D9/10','三峡大坝':'D10','宜昌市':'D10/11','固始县':'D11'};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("map"), world=document.getElementById("world");
const allCoords=Object.values(DATA.routes).flatMap(r=>r.coords);
const xs=allCoords.map(p=>p[1]), ys=allCoords.map(p=>p[0]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
const pad=0.7, W=1200,H=760;
function project(lat,lon){return [(lon-(minX-pad))/(maxX-minX+2*pad)*W,(maxY+pad-lat)/(maxY-minY+2*pad)*H]}
function E(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function mins(m){return Math.floor(m/60)+"小时"+(m%60?m%60+"分":"")}
function pathFor(coords){return coords.map((p,i)=>{const [x,y]=project(p[0],p[1]);return (i?"L":"M")+x.toFixed(2)+","+y.toFixed(2)}).join(" ")}
let activeDay=1;
function draw(day=1){
  world.innerHTML="";
  const bg=E("rect",{x:0,y:0,width:W,height:H,fill:"#e9e6dd"});world.appendChild(bg);
  DATA.days.forEach((d,i)=>{
    if(day!==0 && d.day!==day)return;
    d.keys.forEach(k=>{
      if(!DATA.routes[k])return;
      const p=E("path",{d:pathFor(DATA.routes[k].coords),class:"routepath"+(d.day===10?" conflict":""),stroke:COLORS[i%COLORS.length]});
      p.dataset.day=d.day;p.style.opacity=(day===0||day===d.day)?.86:.18;world.appendChild(p);
    });
  });
  const names=Object.entries(DATA.points);
  names.forEach(([name,ll])=>{
    const [x,y]=project(ll[0],ll[1]);
    const c=E("circle",{cx:x,cy:y,r:5,class:"citydot"});world.appendChild(c);
    const t=E("text",{x:x,y:y-9,class:"pintext"});t.textContent=name;world.appendChild(t);
    c.style.cursor="pointer";t.style.cursor="pointer";
    [c,t].forEach(el=>el.addEventListener("click",()=>showPoint(name)));
  });
  setView();
}
let vx=0,vy=0,scale=1;
function setView(){world.setAttribute("transform",`translate(${vx},${vy}) scale(${scale})`)}
svg.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.12:.89;scale=Math.max(.7,Math.min(8,scale*f));setView()},{passive:false});
let dragging=false,sx=0,sy=0,ox=0,oy=0;
svg.addEventListener("pointerdown",e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=vx;oy=vy;svg.classList.add("drag");svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!dragging)return;vx=ox+(e.clientX-sx);vy=oy+(e.clientY-sy);setView()});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("drag")});
function showPoint(name){
 const t=DATA.ticket[name];const day=markerDays[name]||"";
 document.getElementById("detail").innerHTML=`<h2>${name}</h2><p>${day}</p>${t?`<span class="metric">门票：${t[0]}</span><span class="metric">预约：${t[1]}</span>`:`<span class="metric">住宿/起终点</span>`}`;
}
function showDay(d){
 activeDay=d.day;draw(d.day);
 document.querySelectorAll(".day").forEach(x=>x.classList.toggle("active",+x.dataset.day===d.day));
 document.getElementById("detail").innerHTML=`<h2>Day ${d.day} · ${d.route}</h2><p>${d.date}</p><span class="metric">${d.distance?d.distance+" km":"景区内"}</span><span class="metric">${d.drive?mins(d.drive):"无城际自驾"}</span><p>${d.features||""}</p>`;
}
document.getElementById("days").innerHTML=DATA.days.map(d=>`<button class="day" data-day="${d.day}"><span class="no">DAY ${d.day}</span><span class="date">${d.date}</span><div class="route">${d.route}</div><div class="meta">${d.distance?d.distance+" km":"景区内"} · ${d.drive?mins(d.drive):"无城际自驾"}</div><div class="note">${d.features||""}</div></button>`).join("");
document.querySelectorAll(".day").forEach((el,i)=>el.addEventListener("click",()=>showDay(DATA.days[i])));
draw(0);showDay(DATA.days[0]);
</script>
